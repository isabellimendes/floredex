<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>FLOREDEX - Belli Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        
        body {
            background: #3b2a1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
            padding: 12px;
        }
        
        .gameboy {
            max-width: 420px;
            width: 100%;
            background: #5c3d1a;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 8px 0 #2a1f15, 0 12px 20px rgba(0,0,0,0.4);
            border-bottom: 2px solid #2a1f15;
        }
        
        .screen {
            background: #faf3e0;
            border-radius: 12px;
            padding: 16px;
            border: 4px solid #f5d742;
            box-shadow: inset 0 0 0 2px #3b2a1f, inset 0 0 0 6px #5c3d1a;
            min-height: 560px;
        }
        
        .power-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        
        .logo {
            font-size: 10px;
            color: #f5d742;
            text-shadow: 2px 2px 0 #3b2a1f;
            letter-spacing: 2px;
        }
        
        .logo span {
            font-size: 6px;
            color: #f5d742;
        }
        
        .led {
            width: 8px;
            height: 8px;
            background: #f5d742;
            border-radius: 50%;
            box-shadow: 0 0 6px #f5d742;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .level-box {
            background: #3b2a1f;
            padding: 8px;
            margin-bottom: 12px;
            border-radius: 4px;
            text-align: center;
        }
        
        .level-text {
            font-size: 7px;
            color: #f5d742;
            margin-bottom: 6px;
        }
        
        .level-number {
            font-size: 12px;
            color: #f5d742;
            font-weight: bold;
        }
        
        .xp-bar-bg {
            background: #2a1f15;
            height: 12px;
            border: 1px solid #f5d742;
            margin: 6px 0;
        }
        
        .xp-bar-fill {
            background: #f5d742;
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 7px;
            color: #3b2a1f;
        }
        
        .menu-tabs {
            display: flex;
            gap: 2px;
            margin: 12px 0;
        }
        
        .menu-btn {
            flex: 1;
            background: #3b2a1f;
            border: none;
            padding: 8px 4px;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #f5d742;
            cursor: pointer;
            text-align: center;
        }
        
        .menu-btn.active {
            background: #f5d742;
            color: #3b2a1f;
            box-shadow: inset 0 -2px 0 #5c3d1a;
        }
        
        .pokedex {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 4px;
        }
        
        .pokedex::-webkit-scrollbar {
            width: 6px;
        }
        
        .pokedex::-webkit-scrollbar-track {
            background: #3b2a1f;
        }
        
        .pokedex::-webkit-scrollbar-thumb {
            background: #f5d742;
        }
        
        .entry {
            background: #3b2a1f;
            border: 2px solid #f5d742;
            padding: 8px;
            margin-bottom: 8px;
            display: flex;
            gap: 10px;
            cursor: pointer;
        }
        
        .entry:active {
            background: #5c3d1a;
        }
        
        .entry-sprite {
            width: 48px;
            height: 48px;
            background: #2a1f15;
            border: 2px solid #f5d742;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .entry-sprite img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .entry-data {
            flex: 1;
        }
        
        .entry-number {
            font-size: 6px;
            color: #f5d742;
            margin-bottom: 4px;
        }
        
        .entry-name {
            font-size: 7px;
            color: #faf3e0;
            margin-bottom: 4px;
        }
        
        .entry-name span {
            color: #f5d742;
        }
        
        .entry-badge {
            display: inline-block;
            background: #2a1f15;
            padding: 2px 5px;
            font-size: 5px;
            color: #f5d742;
            margin-right: 4px;
            border-radius: 2px;
        }
        
        .capture-btn {
            width: 100%;
            background: #f5d742;
            border: none;
            padding: 14px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #3b2a1f;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
            box-shadow: 0 4px 0 #5c3d1a;
            -webkit-tap-highlight-color: transparent;
        }
        
        .capture-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #5c3d1a;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(59, 42, 31, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-window {
            background: #5c3d1a;
            border: 4px solid #f5d742;
            max-width: 350px;
            width: 100%;
            padding: 16px;
            max-height: 90%;
            overflow-y: auto;
        }
        
        .modal-title {
            background: #3b2a1f;
            color: #f5d742;
            padding: 8px;
            text-align: center;
            font-size: 8px;
            margin-bottom: 16px;
        }
        
        .preview-box {
            background: #2a1f15;
            padding: 20px;
            text-align: center;
            margin-bottom: 12px;
            border: 2px solid #f5d742;
            min-height: 120px;
            color: #f5d742;
            font-size: 8px;
        }
        
        .preview-box img {
            max-width: 100%;
            max-height: 100px;
        }
        
        .input-field {
            width: 100%;
            background: #3b2a1f;
            border: 2px solid #f5d742;
            padding: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #f5d742;
            margin-bottom: 10px;
        }
        
        .input-field::placeholder {
            color: #8b691b;
        }
        
        .color-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .color-option {
            padding: 6px 10px;
            background: #3b2a1f;
            border: 1px solid #f5d742;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: #f5d742;
            cursor: pointer;
            text-align: center;
        }
        
        .color-option.selected {
            background: #f5d742;
            color: #3b2a1f;
            border: 1px solid #3b2a1f;
        }
        
        .add-color-btn {
            background: #f5d742;
            color: #3b2a1f;
            border: none;
            padding: 6px 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            cursor: pointer;
            margin-top: 5px;
        }
        
        .size-options {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        
        .size-option {
            flex: 1;
            padding: 8px;
            background: #3b2a1f;
            border: 1px solid #f5d742;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #f5d742;
            cursor: pointer;
            text-align: center;
        }
        
        .size-option.selected {
            background: #f5d742;
            color: #3b2a1f;
        }
        
        .form-label {
            font-size: 7px;
            color: #f5d742;
            margin: 8px 0 4px 0;
            display: block;
        }
        
        .warning-box {
            background: #2a1f15;
            padding: 10px;
            margin: 10px 0;
            font-size: 6px;
            color: #f5d742;
            text-align: center;
            border: 1px solid #f5d742;
        }
        
        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .modal-btn {
            flex: 1;
            background: #3b2a1f;
            border: none;
            padding: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #f5d742;
            cursor: pointer;
            text-align: center;
        }
        
        .modal-btn.primary {
            background: #f5d742;
            color: #3b2a1f;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: #3b2a1f;
            border: 2px solid #f5d742;
        }
        
        .empty-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .empty-text {
            font-size: 7px;
            color: #f5d742;
            line-height: 1.8;
        }
        
        hr {
            border-color: #f5d742;
            margin: 8px 0;
        }
        
        .level-up-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #f5d742;
            border: 4px solid #3b2a1f;
            padding: 20px;
            text-align: center;
            z-index: 2000;
            font-size: 10px;
            color: #3b2a1f;
            max-width: 300px;
            animation: fadeOut 3s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); visibility: hidden; }
        }
        
        .color-input-group {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        
        .new-color-input {
            flex: 1;
            background: #3b2a1f;
            border: 1px solid #f5d742;
            padding: 6px;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: #f5d742;
        }
        
        .new-color-input::placeholder {
            color: #8b691b;
            font-size: 5px;
        }
    </style>
</head>
<body>
    <div class="gameboy">
        <div class="screen">
            <div class="power-bar">
                <span class="logo">FLOREDEX <span>v.Belli</span></span>
                <div class="led"></div>
            </div>
            
            <div class="level-box">
                <div class="level-text">JARDINEIRA NÍVEL</div>
                <div class="level-number" id="levelValue">1</div>
                <div class="xp-bar-bg">
                    <div class="xp-bar-fill" id="xpBarFill"></div>
                </div>
                <div class="level-text" id="xpText">0 / 100 XP</div>
            </div>
            
            <div class="stat-row">
                <span>🌸 FLORES: <span id="totalCount">0</span></span>
                <span>⭐ FAV: <span id="favCount">0</span></span>
                <span>🏷️ ESPÉCIES: <span id="uniqueCount">0</span></span>
            </div>
            
            <div class="menu-tabs">
                <button class="menu-btn active" onclick="switchTab('gallery')">📖 POKEDEX</button>
                <button class="menu-btn" onclick="switchTab('local')">⭐ FAVORITAS</button>
                <button class="menu-btn" onclick="openStats()">📊 DADOS</button>
            </div>
            
            <div id="galleryPanel">
                <div class="pokedex" id="galleryList"></div>
            </div>
            
            <div id="localPanel" style="display: none;">
                <div class="pokedex" id="favList"></div>
            </div>
            
            <button class="capture-btn" onclick="openModal()">📷 CAPTURAR</button>
        </div>
    </div>
    
    <!-- INPUT HIDDEN para funcionar no iOS/Android -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    
    <div class="modal" id="captureModal">
        <div class="modal-window">
            <div class="modal-title">🌸 CAPTURAR FLOR</div>
            
            <div class="preview-box" id="previewArea">SEM FOTO</div>
            
            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                <button class="modal-btn" id="cameraBtn">📷 CÂMERA</button>
                <button class="modal-btn" id="galleryBtn">🖼️ GALERIA</button>
            </div>
            
            <hr>
            
            <label class="form-label">🏷️ NOME DA FLOR</label>
            <input type="text" id="flowerName" class="input-field" placeholder="EX: ROSA DOURADA" maxlength="20">
            
            <label class="form-label">🎨 COR PRINCIPAL</label>
            <div class="color-options" id="mainColorOptions"></div>
            <div class="color-input-group">
                <input type="text" id="newMainColor" class="new-color-input" placeholder="NOVA COR...">
                <button class="add-color-btn" id="addMainColorBtn">+</button>
            </div>
            
            <label class="form-label">🌈 COR SECUNDÁRIA (TAGS)</label>
            <div class="color-options" id="secondaryColorOptions"></div>
            <div class="color-input-group">
                <input type="text" id="newSecondaryColor" class="new-color-input" placeholder="NOVA COR...">
                <button class="add-color-btn" id="addSecondaryColorBtn">+</button>
            </div>
            
            <label class="form-label">📏 TAMANHO</label>
            <div class="size-options" id="sizeOptions"></div>
            
            <div id="dupWarning" style="display: none;" class="warning-box">
                ⚠️ VOCÊ JÁ POSSUI UMA FLOR PARECIDA!
                <div id="dupList" style="margin-top: 6px;"></div>
            </div>
            
            <div class="modal-buttons">
                <button class="modal-btn primary" id="saveBtn">💾 SALVAR</button>
                <button class="modal-btn" id="closeModalBtn">❌ VOLTAR</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="detailModal">
        <div class="modal-window">
            <div class="modal-title">🌸 INFO FLOR</div>
            <div id="detailContent" style="text-align: center;"></div>
            <div class="modal-buttons" style="margin-top: 16px;">
                <button class="modal-btn" id="closeDetailBtn">FECHAR</button>
            </div>
        </div>
    </div>
    
    <script>
        let defaultColors = ['🌻 AMARELA', '🌹 VERMELHA', '🩷 ROSA', '🤍 BRANCA', '💜 ROXA', '💙 AZUL', '🧡 LARANJA', '💚 VERDE'];
        let customColors = [];
        let colorsList = [...defaultColors];
        const sizes = ['PEQUENO', 'MÉDIO', 'GRANDE'];
        const XP_PER_FLOWER = 25;
        const XP_PER_FAVORITE_BONUS = 10;
        const XP_BASE_NEXT_LEVEL = 100;
        
        let flowers = [];
        let currentPhoto = null;
        let selectedMainColor = null;
        let selectedSecondaryColor = null;
        let selectedSize = null;
        let currentLevel = 1;
        let currentXP = 0;
        
        // Elementos do DOM
        const fileInput = document.getElementById('fileInput');
        const cameraInput = document.getElementById('cameraInput');
        
        function loadData() {
            const saved = localStorage.getItem('floredex_belli');
            if (saved) {
                const data = JSON.parse(saved);
                flowers = data.flowers || [];
                currentLevel = data.level || 1;
                currentXP = data.xp || 0;
                if (data.customColors) {
                    customColors = data.customColors;
                    colorsList = [...defaultColors, ...customColors];
                }
            }
            updateLevelUI();
            renderLists();
            updateStats();
        }
        
        function saveData() {
            const dataToSave = {
                flowers: flowers,
                level: currentLevel,
                xp: currentXP,
                customColors: customColors
            };
            localStorage.setItem('floredex_belli', JSON.stringify(dataToSave));
            updateStats();
            renderLists();
            updateLevelUI();
        }
        
        function addNewMainColor() {
            const input = document.getElementById('newMainColor');
            const newColor = input.value.trim().toUpperCase();
            
            if (newColor && !colorsList.includes(newColor) && !newColor.includes('NOVA')) {
                customColors.push(newColor);
                colorsList = [...defaultColors, ...customColors];
                saveData();
                renderColorOptions();
                input.value = '';
            } else if (newColor && colorsList.includes(newColor)) {
                alert("⚠️ ESTA COR JÁ EXISTE!");
            } else if (!newColor) {
                alert("📝 DIGITE O NOME DA NOVA COR!");
            }
        }
        
        function addNewSecondaryColor() {
            const input = document.getElementById('newSecondaryColor');
            const newColor = input.value.trim().toUpperCase();
            
            if (newColor && !colorsList.includes(newColor) && !newColor.includes('NOVA')) {
                customColors.push(newColor);
                colorsList = [...defaultColors, ...customColors];
                saveData();
                renderColorOptions();
                input.value = '';
            } else if (newColor && colorsList.includes(newColor)) {
                alert("⚠️ ESTA COR JÁ EXISTE!");
            } else if (!newColor) {
                alert("📝 DIGITE O NOME DA NOVA COR!");
            }
        }
        
        function addXP(amount) {
            let newXP = currentXP + amount;
            let newLevel = currentLevel;
            let leveledUp = false;
            
            while (newXP >= getXPNeededForLevel(newLevel)) {
                newXP -= getXPNeededForLevel(newLevel);
                newLevel++;
                leveledUp = true;
            }
            
            if (leveledUp) {
                showLevelUpMessage(newLevel);
            }
            
            currentXP = newXP;
            currentLevel = newLevel;
            updateLevelUI();
            saveData();
        }
        
        function getXPNeededForLevel(level) {
            return XP_BASE_NEXT_LEVEL + (level - 1) * 25;
        }
        
        function updateLevelUI() {
            const xpNeeded = getXPNeededForLevel(currentLevel);
            const xpPercent = (currentXP / xpNeeded) * 100;
            
            document.getElementById('levelValue').innerText = currentLevel;
            document.getElementById('xpBarFill').style.width = xpPercent + '%';
            document.getElementById('xpText').innerText = `${currentXP} / ${xpNeeded} XP`;
        }
        
        function showLevelUpMessage(newLevel) {
            const messages = [
                `✨ PARABÉNS, MINHA BELLI! ✨\n\nVOCÊ ALCANÇOU O NÍVEL ${newLevel}!\nSEU JARDIM ESTA CADA VEZ MAIS LINDO! 🌸`,
                `🌻 MINHA BELLI QUERIDA! 🌻\n\nVOCÊ SUBIU PARA O NÍVEL ${newLevel}!\nSUA DEDICAÇÃO FAZ AS FLORES MAIS FELIZES! 💛`,
                `⭐ UAU, MINHA BELLI! ⭐\n\nNÍVEL ${newLevel} ALCANÇADO!\nVOCÊ É UMA JARDINEIRA NOTA 10! 🌟`,
                `💐 MINHA BELLI MARAVILHOSA! 💐\n\nNÍVEL ${newLevel}!\nCADA FLOR DESCOBERTA É UMA NOVA ALEGRIA! 🎉`,
                `🌸 PARABÉNS, MEU AMOR! 🌸\n\nVOCÊ ACABOU DE SUBIR PARA O NÍVEL ${newLevel}!\nCONTINUE ASSIM, MINHA BELLI! 💕`
            ];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'level-up-message';
            msgDiv.innerHTML = randomMsg.replace(/\n/g, '<br>');
            document.body.appendChild(msgDiv);
            
            setTimeout(() => {
                msgDiv.remove();
            }, 3500);
        }
        
        function updateStats() {
            document.getElementById('totalCount').innerText = flowers.length;
            document.getElementById('favCount').innerText = flowers.filter(f => f.fav).length;
            const uniqueColors = [...new Set(flowers.map(f => f.mainColor))];
            document.getElementById('uniqueCount').innerText = uniqueColors.length;
        }
        
        function renderLists() {
            const all = [...flowers].reverse();
            const favs = flowers.filter(f => f.fav);
            
            const galleryDiv = document.getElementById('galleryList');
            if (all.length === 0) {
                galleryDiv.innerHTML = `<div class="empty-state"><div class="empty-icon">🌿</div><div class="empty-text">POKEDEX VAZIA<br>APERTE CAPTURAR<br>PARA COMEÇAR</div></div>`;
            } else {
                galleryDiv.innerHTML = all.map((f, i) => `
                    <div class="entry" onclick="showDetail('${f.id}')">
                        <div class="entry-sprite">${f.photo ? `<img src="${f.photo}">` : '🌼'}</div>
                        <div class="entry-data">
                            <div class="entry-number">#${String(i+1).padStart(3,'0')}</div>
                            <div class="entry-name">${f.name} ${f.fav ? '<span>★</span>' : ''}</div>
                            <div><span class="entry-badge">${f.mainColor}</span>${f.secondaryColor ? `<span class="entry-badge">${f.secondaryColor}</span>` : ''}<span class="entry-badge">${f.size}</span></div>
                        </div>
                        <div onclick="event.stopPropagation(); toggleFav('${f.id}')" style="font-size:14px; padding:5px; color:#f5d742;">${f.fav ? '★' : '☆'}</div>
                    </div>
                `).join('');
            }
            
            const favDiv = document.getElementById('favList');
            if (favs.length === 0) {
                favDiv.innerHTML = `<div class="empty-state"><div class="empty-icon">⭐</div><div class="empty-text">SEM FAVORITAS<br>MARQUE COM ★</div></div>`;
            } else {
                favDiv.innerHTML = favs.map((f, i) => `
                    <div class="entry" onclick="showDetail('${f.id}')">
                        <div class="entry-sprite">${f.photo ? `<img src="${f.photo}">` : '⭐'}</div>
                        <div class="entry-data">
                            <div class="entry-number">FAV #${String(i+1).padStart(2,'0')}</div>
                            <div class="entry-name">${f.name} ★</div>
                            <span class="entry-badge">${f.mainColor}</span>
                            <span class="entry-badge">${f.size}</span>
                        </div>
                    </div>
                `).join('');
            }
        }
        
        function toggleFav(id) {
            const f = flowers.find(f => f.id === id);
            if (f) {
                const wasFav = f.fav;
                f.fav = !f.fav;
                saveData();
                if (!wasFav && f.fav) addXP(XP_PER_FAVORITE_BONUS);
            }
        }
        
        function checkDuplicate() {
            const mainColor = selectedMainColor;
            const name = document.getElementById('flowerName').value.trim().toLowerCase();
            
            if (!mainColor && !name) {
                document.getElementById('dupWarning').style.display = 'none';
                return;
            }
            
            let similar = [];
            if (mainColor) similar = flowers.filter(f => f.mainColor === mainColor);
            if (name && name.length > 2) {
                flowers.forEach(f => { if (f.name.toLowerCase().includes(name) && !similar.includes(f)) similar.push(f); });
            }
            
            if (similar.length > 0) {
                document.getElementById('dupWarning').style.display = 'block';
                document.getElementById('dupList').innerHTML = similar.slice(0, 2).map(f => `<div style="font-size:6px; margin:4px 0;">${f.name} (${f.mainColor})</div>`).join('');
            } else {
                document.getElementById('dupWarning').style.display = 'none';
            }
        }
        
        function renderColorOptions() {
            const mainContainer = document.getElementById('mainColorOptions');
            const secondaryContainer = document.getElementById('secondaryColorOptions');
            
            mainContainer.innerHTML = colorsList.map(color => `<div class="color-option ${selectedMainColor === color ? 'selected' : ''}" onclick="selectMainColor('${color.replace(/'/g, "\\'")}')">${color}</div>`).join('');
            secondaryContainer.innerHTML = '<div class="color-option" onclick="selectSecondaryColor(null)">🚫 NENHUMA</div>' + colorsList.map(color => `<div class="color-option ${selectedSecondaryColor === color ? 'selected' : ''}" onclick="selectSecondaryColor('${color.replace(/'/g, "\\'")}')">${color}</div>`).join('');
        }
        
        function renderSizeOptions() {
            const container = document.getElementById('sizeOptions');
            container.innerHTML = sizes.map(size => `<div class="size-option ${selectedSize === size ? 'selected' : ''}" onclick="selectSize('${size}')">${size}</div>`).join('');
        }
        
        function selectMainColor(color) { selectedMainColor = color; renderColorOptions(); checkDuplicate(); }
        function selectSecondaryColor(color) { selectedSecondaryColor = color; renderColorOptions(); }
        function selectSize(size) { selectedSize = size; renderSizeOptions(); }
        
        // FUNÇÕES DE CÂMERA CORRIGIDAS
        function openCamera() {
            cameraInput.value = '';
            cameraInput.click();
        }
        
        function openGallery() {
            fileInput.value = '';
            fileInput.click();
        }
        
        function handleImageFile(file) {
            if (!file) return;
            
            if (!file.type.match('image.*')) {
                alert("📸 POR FAVOR, SELECIONE UMA IMAGEM!");
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (ev) => {
                currentPhoto = ev.target.result;
                const previewArea = document.getElementById('previewArea');
                previewArea.innerHTML = `<img src="${currentPhoto}" style="max-width:100%; max-height:100px;">`;
            };
            reader.readAsDataURL(file);
        }
        
        function saveFlower() {
            const name = document.getElementById('flowerName').value.trim();
            
            if (!name) { alert("🌻 DÊ UM NOME PARA A FLOR!"); return; }
            if (!selectedMainColor) { alert("🎨 SELECIONE A COR PRINCIPAL!"); return; }
            if (!selectedSize) { alert("📏 SELECIONE O TAMANHO!"); return; }
            if (!currentPhoto) { alert("📸 TIRE UMA FOTO DA FLOR!"); return; }
            
            const newFlower = {
                id: Date.now().toString(),
                name: name.toUpperCase(),
                mainColor: selectedMainColor,
                secondaryColor: selectedSecondaryColor || null,
                size: selectedSize,
                tags: selectedSecondaryColor ? [selectedSecondaryColor] : [],
                photo: currentPhoto,
                date: new Date().toISOString(),
                fav: false
            };
            
            flowers.push(newFlower);
            addXP(XP_PER_FLOWER);
            saveData();
            closeModal();
            
            currentPhoto = null;
            selectedMainColor = null;
            selectedSecondaryColor = null;
            selectedSize = null;
            document.getElementById('flowerName').value = '';
            document.getElementById('previewArea').innerHTML = 'SEM FOTO';
            document.getElementById('dupWarning').style.display = 'none';
            renderColorOptions();
            renderSizeOptions();
            
            alert(`🌻 ${name.toUpperCase()} FOI ADICIONADA À FLORÉDEX!\n+${XP_PER_FLOWER} XP!`);
        }
        
        function showDetail(id) {
            const f = flowers.find(f => f.id === id);
            if (f) {
                document.getElementById('detailContent').innerHTML = `
                    <div class="preview-box" style="padding:10px;">${f.photo ? `<img src="${f.photo}" style="max-width:100%; max-height:120px;">` : '🌼'}</div>
                    <div style="font-size:10px; margin:8px 0; color:#f5d742;">${f.name}</div>
                    <div style="font-size:7px;">🎨 COR: ${f.mainColor}</div>
                    ${f.secondaryColor ? `<div style="font-size:7px;">🌈 DETALHE: ${f.secondaryColor}</div>` : ''}
                    <div style="font-size:7px;">📏 TAMANHO: ${f.size}</div>
                    <div style="font-size:6px; margin-top:6px;">📅 ${new Date(f.date).toLocaleDateString()}</div>
                `;
                document.getElementById('detailModal').classList.add('active');
            }
        }
        
        function openStats() {
            const total = flowers.length;
            const favs = flowers.filter(f => f.fav).length;
            const colorsCount = {};
            const sizesCount = { PEQUENO: 0, MÉDIO: 0, GRANDE: 0 };
            
            flowers.forEach(f => {
                colorsCount[f.mainColor] = (colorsCount[f.mainColor] || 0) + 1;
                sizesCount[f.size] = (sizesCount[f.size] || 0) + 1;
            });
            
            let statsText = `📊 ESTATÍSTICAS\n\n🌸 TOTAL: ${total}\n⭐ FAVORITAS: ${favs}\n🏆 NÍVEL: ${currentLevel}\n✨ XP: ${currentXP}/${getXPNeededForLevel(currentLevel)}\n\n🎨 CORES:\n`;
            for (let [c, q] of Object.entries(colorsCount)) statsText += `  ${c}: ${q}\n`;
            statsText += `\n📏 TAMANHOS:\n  PEQUENO: ${sizesCount.PEQUENO}\n  MÉDIO: ${sizesCount.MÉDIO}\n  GRANDE: ${sizesCount.GRANDE}`;
            alert(statsText);
        }
